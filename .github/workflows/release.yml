name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate version and package
        shell: bash
        run: |
          VERSION="$(node -p "require('./.cursor-plugin/plugin.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          node scripts/validate-plugin.mjs
          node --test scripts/checkpoint-hook.test.mjs
          git archive --format=zip --output="xmemo-cursor-plugin-${VERSION}.zip" "${GITHUB_SHA}"
          sha256sum "xmemo-cursor-plugin-${VERSION}.zip" > "xmemo-cursor-plugin-${VERSION}.zip.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" xmemo-cursor-plugin-*.zip xmemo-cursor-plugin-*.sha256 --generate-notes --verify-tag
